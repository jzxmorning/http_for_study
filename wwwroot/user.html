<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="查看你的 JIAO 学习平台账号信息。">
  <title>个人信息 · JIAO 学习平台</title>
  <link rel="stylesheet" href="/session.css">
  <link rel="stylesheet" href="/progress.css">
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #203c32; background: #f6f7f2; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    :focus-visible { outline: 3px solid #8bbca6; outline-offset: 4px; }
    .shell { width: min(1100px, calc(100% - 48px)); margin: auto; }
    header { min-height: 96px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid #dfe5db; }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; background: #244b3b; color: #fff; border-radius: 11px; font-size: 22px; font-family: Georgia, serif; }
    .brand-name { letter-spacing: 2px; }
    .brand-label { color: #68786d; font-size: 13px; margin-left: 4px; font-weight: 400; }
    .nav-link { font-size: 14px; padding: 10px 0; }
    .nav-link:hover, .breadcrumb a:hover { text-decoration: underline; text-underline-offset: 4px; }
    main { min-height: calc(100vh - 162px); padding: 40px 0 64px; }
    .breadcrumb { display: flex; gap: 12px; margin-bottom: 32px; color: #788079; font-size: 13px; }
    .breadcrumb a { color: #315e43; }
    .heading { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .eyebrow { margin: 0 0 12px; color: #657a6c; font-size: 12px; letter-spacing: 3px; }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 42px); line-height: 1.4; font-weight: 600; }
    .intro { margin: 12px 0 0; color: #788079; line-height: 1.8; font-size: 14px; }
    .refresh { flex-shrink: 0; min-height: 40px; padding: 9px 16px; border: 1px solid #cdd9cc; border-radius: 8px; background: #fff; color: #244b3b; font-size: 14px; cursor: pointer; }
    .refresh:disabled { opacity: .6; cursor: wait; }
    .card { border: 1px solid #e0e6dc; border-radius: 18px; background: #fff; box-shadow: 0 16px 48px #203c3208; }
    .message { margin: 0; padding: 64px 24px; text-align: center; color: #68786d; line-height: 1.8; }
    .message[data-state="error"] { color: #a03f2b; }
    .user-layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); gap: 28px; }
    .user-summary { padding: 36px 26px; text-align: center; align-self: start; }
    .user-avatar { display: grid; place-items: center; width: 84px; height: 84px; margin: 0 auto 22px; border-radius: 28px; background: #244b3b; color: #fff; font-size: 34px; }
    .user-name { margin: 0 0 12px; font-size: 23px; font-weight: 600; overflow-wrap: anywhere; }
    .summary-note { margin: 24px 0; padding-top: 24px; border-top: 1px solid #edf0e9; color: #788079; font-size: 14px; line-height: 1.9; }
    .practice-link { display: block; padding: 13px 18px; border-radius: 9px; background: #244b3b; color: #fff; font-size: 14px; }
    .practice-link:hover { background: #173b2b; }
    .user-information { padding: 32px; }
    .user-information h2 { margin: 0; font-size: 20px; font-weight: 600; }
    .information-note { margin: 10px 0 26px; color: #788079; font-size: 14px; line-height: 1.8; }
    .information-list { margin: 0; }
    .information-list > div { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 24px; padding: 22px 0; border-top: 1px solid #edf0e9; font-size: 15px; line-height: 1.8; }
    dt { color: #788079; }
    dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
    .account-note { margin: 20px 0 0; padding: 14px 16px; border-radius: 9px; background: #f4f7f0; color: #68786d; font-size: 13px; line-height: 1.8; }
    .user-study { margin-top: 28px; padding: 28px; }
    .study-heading { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; }
    .study-heading h2 { margin: 0; font-size: 20px; font-weight: 600; }
    .user-study .study-summary { margin: 24px 0 0; }
    .study-links { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 22px; }
    footer { min-height: 66px; padding: 22px 0; border-top: 1px solid #dfe5db; color: #7a877a; font-size: 12px; }
    @media (max-width: 680px) {
      .shell { width: calc(100% - 32px); }
      header { min-height: 76px; }
      .brand-label { display: none; }
      main { min-height: calc(100vh - 142px); padding: 28px 0 36px; }
      .user-layout { grid-template-columns: 1fr; gap: 20px; }
      .user-summary, .user-information { padding: 26px 22px; }
      .heading { align-items: flex-start; }
      .information-list > div { grid-template-columns: 62px minmax(0, 1fr); gap: 16px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/" aria-label="JIAO 学习平台首页">
        <span class="brand-mark" aria-hidden="true">J</span>
        <span class="brand-name">JIAO<span class="brand-label">学习平台</span></span>
      </a>
      <nav class="account-nav" aria-label="账号导航">
        <a class="nav-link" href="/questions.html">题目列表</a>
        <div class="session-person" id="session-info" hidden>
          <a class="account-link" id="user-link" href="/user.html" aria-current="page" aria-label="我的个人信息">
            <span class="account-avatar" id="session-avatar" aria-hidden="true">我</span>
            <span class="session-name" id="session-name"></span>
            <span class="session-role" id="session-role"></span>
          </a>
          <button class="logout-button" id="logout-button" type="button">退出登录</button>
        </div>
      </nav>
    </header>
    <main>
      <nav class="breadcrumb" aria-label="当前位置"><a href="/questions.html">题目列表</a><span aria-hidden="true">/</span><span aria-current="page">个人信息</span></nav>
      <p class="session-notice" id="session-notice" role="status" aria-live="polite" hidden></p>
      <div class="heading">
        <div><p class="eyebrow">YOUR ACCOUNT</p><h1>个人信息</h1><p class="intro">查看你的账号资料，继续今天的学习。</p></div>
        <button class="refresh" id="refresh-user" type="button">刷新信息</button>
      </div>
      <section id="user-content" aria-label="个人资料" aria-busy="true">
        <p class="card message" id="user-message" role="status" aria-live="polite">正在获取个人信息，请稍候…</p>
        <div class="user-layout" id="user-detail" hidden>
          <aside class="card user-summary" aria-label="当前账号">
            <div class="user-avatar" id="user-avatar" aria-hidden="true"></div>
            <h2 class="user-name" id="user-name"></h2>
            <span class="session-role" id="user-role"></span>
            <p class="summary-note">每一次认真思考，<br>都在积累下一步的力量。</p>
            <a class="practice-link" href="/questions.html">继续练习 →</a>
          </aside>
          <section class="card user-information" aria-labelledby="information-title">
            <h2 id="information-title">账号资料</h2>
            <p class="information-note">这里展示当前登录账号的信息。</p>
            <dl class="information-list">
              <div><dt>昵称</dt><dd id="user-display-name"></dd></div>
              <div><dt>登录账号</dt><dd id="user-account"></dd></div>
              <div><dt>身份</dt><dd id="user-identity"></dd></div>
            </dl>
            <p class="account-note">使用公共设备学习后，记得点击右上角“退出登录”。</p>
          </section>
        </div>
      </section>
      <section class="card user-study" id="study-content" aria-labelledby="study-title" aria-busy="false">
        <div class="study-heading">
          <h2 id="study-title">当前题库练习概况</h2>
          <div class="progress-actions">
            <button class="save-progress" id="save-progress" type="button" aria-describedby="save-status">保存记录</button>
            <button class="refresh" id="refresh-study" type="button">刷新进度</button>
          </div>
        </div>
        <p class="save-status" id="save-status" role="status" aria-live="polite" aria-atomic="true" hidden></p>
        <p class="progress-feedback" id="study-message" role="status" aria-live="polite">正在获取练习进度…</p>
        <dl class="study-summary" id="study-summary" hidden>
          <div class="study-stat"><dt>已练习 / 全部题目</dt><dd id="study-attempted">—</dd></div>
          <div class="study-stat"><dt>总提交次数</dt><dd id="study-submissions">—</dd></div>
          <div class="study-stat"><dt>提交正确率</dt><dd id="study-accuracy">—</dd></div>
          <div class="study-stat"><dt>最近答错的题目</dt><dd id="study-incorrect">—</dd></div>
        </dl>
        <div class="study-links"><a class="continue-link" href="/questions.html">查看全部题目 →</a><a class="continue-link" href="/questions.html?status=incorrect">复习最近错题 →</a></div>
        <p class="practice-note">新增作答后请点击“保存记录”，退出或登录失效前记得保存。</p>
      </section>
      <noscript><p>请启用 JavaScript 后查看个人信息。</p></noscript>
    </main>
    <footer>JIAO · 让学习每天发生。</footer>
  </div>
  <script src="/session.js"></script>
  <script src="/progress.js"></script>
  <script>
    const refreshUser = document.getElementById('refresh-user');
    const userContent = document.getElementById('user-content');
    const userMessage = document.getElementById('user-message');
    const userDetail = document.getElementById('user-detail');
    let studyRequest = 0;

    async function loadStudyProgress() {
      const request = ++studyRequest;
      const area = document.getElementById('study-content');
      const feedback = document.getElementById('study-message');
      const button = document.getElementById('refresh-study');
      button.disabled = true;
      area.setAttribute('aria-busy', 'true');
      document.getElementById('study-summary').hidden = true;
      feedback.textContent = '正在获取练习进度…';
      feedback.dataset.state = 'pending';
      feedback.hidden = false;
      try {
        const questions = await JiaoProgress.fetchQuestions();
        if (questions === null || request !== studyRequest) return;
        const stats = JiaoProgress.summarize(questions);
        document.getElementById('study-attempted').textContent = `${stats.attempted} / ${stats.total}`;
        document.getElementById('study-submissions').textContent = stats.submissions;
        document.getElementById('study-accuracy').textContent = stats.accuracy;
        document.getElementById('study-incorrect').textContent = stats.incorrect;
        document.getElementById('study-summary').hidden = false;
        feedback.hidden = true;
      } catch (error) {
        if (request !== studyRequest) return;
        feedback.dataset.state = 'error';
        feedback.textContent = error.name === 'AbortError' ? '获取超时，请点击“刷新进度”重试。'
          : (error.name === 'TypeError' ? '暂时无法连接服务，请稍后重试。' : error.message);
      } finally {
        if (request === studyRequest) {
          button.disabled = false;
          area.setAttribute('aria-busy', 'false');
        }
      }
    }

    async function loadUser() {
      if (refreshUser.disabled) return;
      refreshUser.disabled = true;
      refreshUser.textContent = '正在获取…';
      userContent.setAttribute('aria-busy', 'true');
      userDetail.hidden = true;
      userMessage.hidden = false;
      userMessage.dataset.state = 'pending';
      userMessage.textContent = '正在获取个人信息，请稍候…';
      document.getElementById('session-notice').hidden = true;
      try {
        // 此路由在 http.cc 中直接调用你编写的 HandleShowUser。
        const user = await JiaoSession.init({ required: true, endpoint: '/api/showuser' });
        if (!user) {
          userMessage.dataset.state = 'error';
          userMessage.textContent = '未能获取个人信息，请点击“刷新信息”重试。';
          document.getElementById('study-message').textContent = '练习进度尚未加载，可点击“刷新进度”重试。';
          return;
        }
        const name = user.name || user.idcount;
        document.getElementById('user-avatar').textContent = Array.from(name.trim())[0] || '我';
        document.getElementById('user-name').textContent = name;
        document.getElementById('user-role').textContent = JiaoSession.roleName(user.identity);
        document.getElementById('user-display-name').textContent = name;
        document.getElementById('user-account').textContent = user.idcount;
        document.getElementById('user-identity').textContent = JiaoSession.roleName(user.identity);
        userMessage.hidden = true;
        userDetail.hidden = false;
        loadStudyProgress();
      } finally {
        refreshUser.disabled = false;
        refreshUser.textContent = '刷新信息';
        userContent.setAttribute('aria-busy', 'false');
      }
    }

    refreshUser.addEventListener('click', loadUser);
    JiaoProgress.bindSaveButton({ onSaved: loadStudyProgress });
    document.getElementById('refresh-study').addEventListener('click', loadStudyProgress);
    loadUser();
  </script>
</body>
</html>
