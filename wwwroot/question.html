<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="查看 JIAO 学习平台的题目详情与选项。">
  <title>题目详情 · JIAO 学习平台</title>
  <link rel="stylesheet" href="/session.css">
  <link rel="stylesheet" href="/progress.css">
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; color: #203c32; background: #f6f7f2; }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { margin: 0; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    button, input { font: inherit; }
    :focus-visible { outline: 3px solid #8bbca6; outline-offset: 4px; }
    .shell { width: min(1100px, calc(100% - 48px)); margin: auto; }
    header { min-height: 96px; display: flex; align-items: center; justify-content: space-between; gap: 20px; border-bottom: 1px solid #dfe5db; }
    .brand { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; }
    .brand-mark { display: grid; place-items: center; width: 38px; height: 38px; background: #244b3b; color: white; border-radius: 11px; font-size: 22px; font-family: Georgia, serif; }
    .brand-name { letter-spacing: 2px; }
    .brand-label { color: #68786d; font-size: 13px; margin-left: 4px; font-weight: 400; }
    .nav-link { font-size: 14px; padding: 10px 0; }
    .nav-link:hover, .breadcrumb a:hover { text-decoration: underline; text-underline-offset: 4px; }
    main { min-height: calc(100vh - 162px); padding: 40px 0 64px; }
    .breadcrumb { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; color: #788079; font-size: 13px; }
    .breadcrumb a { color: #315e43; }
    .heading { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 28px; }
    .eyebrow { margin: 0 0 12px; color: #657a6c; font-size: 12px; letter-spacing: 3px; }
    h1 { margin: 0; font-size: clamp(30px, 4vw, 40px); line-height: 1.4; font-weight: 600; }
    .refresh { flex-shrink: 0; min-height: 40px; padding: 9px 16px; border: 1px solid #cdd9cc; border-radius: 8px; background: #fff; color: #244b3b; font-size: 14px; cursor: pointer; }
    .refresh:hover { background: #f0f5ed; }
    .refresh:disabled { opacity: .6; cursor: wait; }
    .card { overflow: hidden; background: #fff; border: 1px solid #e0e6dc; border-radius: 16px; box-shadow: 0 16px 48px #203c3208; }
    .message { margin: 0; padding: 64px 24px; color: #68786d; text-align: center; line-height: 1.8; overflow-wrap: anywhere; }
    .message[data-state="error"] { color: #a03f2b; background: #fff8f5; }
    .question-meta { display: flex; justify-content: space-between; align-items: baseline; gap: 20px; padding: 22px 32px; border-bottom: 1px solid #e6ebe2; }
    .question-number { margin: 0; color: #68786d; font-size: 14px; }
    .question-score { margin: 0; padding: 5px 12px; background: #eff5eb; border-radius: 6px; color: #315e43; font-size: 13px; overflow-wrap: anywhere; }
    .question-body { padding: 32px; }
    h2 { margin: 0 0 16px; font-size: 14px; font-weight: 500; color: #788079; }
    .question-title { margin: 0; font-size: 19px; line-height: 1.9; white-space: pre-wrap; overflow-wrap: anywhere; }
    .choices { margin-top: 32px; padding-top: 26px; border-top: 1px solid #edf0e9; }
    .question-choices { margin: 0; font-size: 16px; line-height: 2; white-space: pre-wrap; overflow-wrap: anywhere; }
    .answer-section { margin-top: 32px; padding-top: 26px; border-top: 1px solid #edf0e9; }
    .practice-progress { margin-top: 32px; padding: 22px; border: 1px solid #e0e6dc; border-radius: 12px; background: #fafcf7; }
    .practice-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    .practice-heading h2 { margin: 0; color: #315e43; }
    .practice-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
    .practice-tools .refresh { padding: 6px 10px; min-height: 34px; font-size: 12px; }
    .answer-help { margin: -4px 0 18px; color: #788079; font-size: 14px; line-height: 1.8; }
    .answer-fields { border: 0; padding: 0; margin: 0; min-width: 0; }
    .answer-label { display: block; margin-bottom: 9px; font-size: 14px; }
    .answer-controls { display: flex; align-items: stretch; gap: 12px; }
    .answer-input { flex: 1; min-width: 0; min-height: 48px; border: 1px solid #d9e1d8; border-radius: 9px; padding: 12px 14px; color: #203c32; background: #fcfdfb; }
    .answer-input:focus { border-color: #477a60; }
    .answer-input::placeholder { color: #929b91; }
    .submit-answer { min-height: 48px; padding: 12px 24px; border: 0; border-radius: 9px; background: #244b3b; color: #fff; cursor: pointer; }
    .submit-answer:hover { background: #173b2b; }
    .answer-fields:disabled { opacity: .65; }
    .answer-fields:disabled .submit-answer { cursor: wait; }
    .answer-result { margin-top: 22px; padding: 20px; border: 1px solid #dce5d8; border-radius: 10px; background: #f4f7f0; overflow-wrap: anywhere; }
    .answer-result[data-state="correct"] { background: #edf6ee; border-color: #cce1cb; color: #24573b; }
    .answer-result[data-state="incorrect"] { background: #fff8ed; border-color: #eee0c4; color: #825b20; }
    .answer-result[data-state="error"] { background: #fff1ed; border-color: #efd8d0; color: #a03f2b; }
    .answer-result h3 { margin: 0; font-size: 18px; font-weight: 600; }
    .answer-result p { margin: 8px 0 0; font-size: 14px; line-height: 1.8; white-space: pre-wrap; }
    .back-link { display: inline-block; margin-top: 26px; color: #315e43; font-size: 14px; text-decoration: underline; text-underline-offset: 4px; }
    footer { min-height: 66px; padding: 22px 0; border-top: 1px solid #dfe5db; color: #7a877a; font-size: 12px; }
    @media (max-width: 680px) {
      .shell { width: calc(100% - 32px); }
      header { min-height: 76px; }
      .brand-label { display: none; }
      main { min-height: calc(100vh - 142px); padding: 28px 0 36px; }
      .heading { margin-bottom: 22px; }
      .breadcrumb { margin-bottom: 24px; }
      .question-meta { padding: 20px; }
      .question-body { padding: 24px 20px; }
      .question-title { font-size: 17px; }
      .question-choices { font-size: 15px; }
      .answer-controls { flex-direction: column; }
      .submit-answer { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/" aria-label="JIAO 学习平台首页">
        <span class="brand-mark" aria-hidden="true">J</span>
        <span class="brand-name">JIAO<span class="brand-label">学习平台</span></span>
      </a>
      <nav class="account-nav" aria-label="账号导航">
        <a class="nav-link" href="/questions.html">题目列表</a>
        <div class="session-person" id="session-info" hidden>
          <a class="account-link" id="user-link" href="/user.html" aria-label="查看我的个人信息">
            <span class="account-avatar" id="session-avatar" aria-hidden="true">我</span>
            <span class="session-name" id="session-name"></span>
            <span class="session-role" id="session-role"></span>
            <span aria-hidden="true">↗</span>
          </a>
          <button class="logout-button" id="logout-button" type="button">退出登录</button>
        </div>
      </nav>
    </header>

    <main>
      <p class="session-notice" id="session-notice" role="status" aria-live="polite" hidden></p>
      <nav class="breadcrumb" aria-label="当前位置">
        <a href="/questions.html">题目列表</a><span aria-hidden="true">/</span><span aria-current="page">题目详情</span>
      </nav>
      <div class="heading">
        <div><p class="eyebrow">TAKE A CLOSER LOOK</p><h1>题目详情</h1></div>
        <button class="refresh" id="refresh-button" type="button">重新加载</button>
      </div>

      <article class="card" id="question-content" aria-label="题目内容" aria-busy="true">
        <p class="message" id="question-message" role="status" aria-live="polite" aria-atomic="true">正在加载题目，请稍候…</p>
        <div id="question-detail" hidden>
          <div class="question-meta">
            <p class="question-number" id="question-number"></p>
            <p class="question-score" id="question-score"></p>
          </div>
          <div class="question-body">
            <section aria-labelledby="title-label">
              <h2 id="title-label">题干</h2>
              <p class="question-title" id="question-title"></p>
            </section>
            <section class="choices" aria-labelledby="choices-label">
              <h2 id="choices-label">选项</h2>
              <p class="question-choices" id="question-choices"></p>
            </section>
            <section class="answer-section" aria-labelledby="answer-label">
              <h2 id="answer-label">作答</h2>
              <p class="answer-help" id="answer-help">按照题目要求填写答案，再提交判题。</p>
              <form id="answer-form" method="post" aria-describedby="answer-help">
                <fieldset class="answer-fields" id="answer-fields" disabled>
                  <label class="answer-label" for="answer-input">你的答案</label>
                  <div class="answer-controls">
                    <input class="answer-input" id="answer-input" name="answer" type="text" placeholder="请输入答案，例如 A" autocomplete="off" autocapitalize="characters" spellcheck="false" enterkeyhint="send" required>
                    <button class="submit-answer" id="submit-answer" type="submit">提交判题</button>
                  </div>
                </fieldset>
              </form>
              <div class="answer-result" id="answer-result" role="status" aria-live="polite" aria-atomic="true" hidden>
                <h3 id="result-title"></h3>
                <p id="result-message"></p>
                <p id="result-answer" hidden></p>
              </div>
            </section>
            <section class="practice-progress" id="practice-progress" aria-labelledby="practice-title" aria-busy="false">
              <div class="practice-heading">
                <h2 id="practice-title">我的作答记录</h2>
                <div class="practice-tools">
                  <span class="progress-badge" id="practice-status" hidden></span>
                  <button class="save-progress" id="save-progress" type="button" aria-describedby="save-status">保存记录</button>
                  <button class="refresh" id="refresh-progress" type="button">刷新记录</button>
                </div>
              </div>
              <p class="save-status" id="save-status" role="status" aria-live="polite" aria-atomic="true" hidden></p>
              <p class="progress-feedback" id="practice-message" role="status" aria-live="polite">正在获取作答记录…</p>
              <dl class="progress-fields" id="practice-fields" hidden>
                <div><dt>提交次数</dt><dd id="practice-attempt">—</dd></div>
                <div><dt>答对次数</dt><dd id="practice-correct">—</dd></div>
                <div><dt>最近答案</dt><dd id="practice-answer">—</dd></div>
                <div><dt>最近作答时间</dt><dd id="practice-time">—</dd></div>
              </dl>
              <p class="practice-note">新增作答后请点击“保存记录”，退出或登录失效前记得保存。</p>
            </section>
          </div>
        </div>
      </article>
      <a class="back-link" href="/questions.html">← 返回全部题目</a>
      <noscript><p>请启用 JavaScript 后查看题目详情。</p></noscript>
    </main>

    <footer>JIAO · 让学习每天发生。</footer>
  </div>

  <script src="/session.js"></script>
  <script src="/progress.js"></script>
  <script>
    const refreshButton = document.getElementById('refresh-button');
    const content = document.getElementById('question-content');
    const message = document.getElementById('question-message');
    const detail = document.getElementById('question-detail');
    const number = document.getElementById('question-number');
    const score = document.getElementById('question-score');
    const title = document.getElementById('question-title');
    const choices = document.getElementById('question-choices');
    const answerForm = document.getElementById('answer-form');
    const answerFields = document.getElementById('answer-fields');
    const answerInput = document.getElementById('answer-input');
    const submitAnswer = document.getElementById('submit-answer');
    const answerResult = document.getElementById('answer-result');
    const resultTitle = document.getElementById('result-title');
    const resultMessage = document.getElementById('result-message');
    const resultAnswer = document.getElementById('result-answer');
    let currentQuestion = null;
    let judging = false;
    let progressRequest = 0;
    const rawId = new URLSearchParams(window.location.search).get('id');
    const validId = rawId !== null && /^[0-9]+$/.test(rawId) &&
      Number.isInteger(Number(rawId)) && Number(rawId) <= 2147483647;
    const questionId = validId ? String(Number(rawId)) : null;

    function showMessage(text, state) {
      message.textContent = text;
      message.dataset.state = state;
      message.hidden = false;
      detail.hidden = true;
    }

    function showResult(state, heading, text, answer = '') {
      answerResult.dataset.state = state;
      resultTitle.textContent = heading;
      resultMessage.textContent = text;
      resultAnswer.textContent = answer ? `本次提交的答案：${answer}` : '';
      resultAnswer.hidden = !answer;
      answerResult.hidden = false;
    }

    async function loadProgress() {
      if (currentQuestion === null) return;
      const request = ++progressRequest;
      const question = currentQuestion;
      const area = document.getElementById('practice-progress');
      const feedback = document.getElementById('practice-message');
      const button = document.getElementById('refresh-progress');
      const badge = document.getElementById('practice-status');
      area.setAttribute('aria-busy', 'true');
      button.disabled = true;
      badge.hidden = true;
      document.getElementById('practice-fields').hidden = true;
      feedback.textContent = '正在获取作答记录…';
      feedback.dataset.state = 'pending';
      feedback.hidden = false;
      try {
        const questions = await JiaoProgress.fetchQuestions();
        if (questions === null || request !== progressRequest) return;
        const record = questions.find(item => item.id === question.id);
        if (!record) throw new Error('未找到这道题的作答记录，请刷新题目列表。');
        badge.textContent = record.status;
        badge.dataset.state = record.state;
        badge.hidden = false;
        document.getElementById('practice-attempt').textContent = `${record.attempt} 次`;
        document.getElementById('practice-correct').textContent = `${record.correctCount} 次`;
        document.getElementById('practice-answer').textContent = record.lastAnswer || '—';
        document.getElementById('practice-time').textContent = record.lastTime;
        document.getElementById('practice-fields').hidden = false;
        feedback.hidden = true;
      } catch (error) {
        if (request !== progressRequest) return;
        feedback.textContent = error.name === 'AbortError' ? '获取超时，请点击“刷新记录”重试。'
          : (error.name === 'TypeError' ? '暂时无法连接服务，请点击“刷新记录”重试。' : error.message);
        feedback.dataset.state = 'error';
      } finally {
        if (request === progressRequest) {
          area.setAttribute('aria-busy', 'false');
          button.disabled = false;
        }
      }
    }

    async function loadQuestion() {
      if (questionId === null) {
        showMessage('没有找到有效的题目编号，请返回题目列表重新选择。', 'error');
        refreshButton.hidden = true;
        content.setAttribute('aria-busy', 'false');
        return;
      }
      if (refreshButton.disabled) return;
      ++progressRequest;
      currentQuestion = null;
      answerFields.disabled = true;
      answerResult.hidden = true;
      refreshButton.disabled = true;
      refreshButton.textContent = '正在加载…';
      content.setAttribute('aria-busy', 'true');
      showMessage('正在加载题目，请稍候…', 'pending');

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);
      try {
        const response = await fetch(`/api/question/${encodeURIComponent(questionId)}`, {
          method: 'GET',
          headers: { 'Accept': 'application/json' },
          cache: 'no-store',
          signal: controller.signal
        });
        if (JiaoSession.redirectIfUnauthorized(response)) return;
        let data;
        try {
          data = await response.json();
        } catch (error) {
          if (error.name === 'AbortError') throw error;
          showMessage('服务响应异常，请点击“重新加载”重试。', 'error');
          return;
        }

        if (!response.ok || !data || data.success === false) {
          const errorMessage = data && typeof data.message === 'string' && data.message
            ? data.message : (response.status === 404
              ? '没有找到这道题，请返回题目列表重新选择。'
              : '获取题目失败，请点击“重新加载”重试。');
          showMessage(errorMessage, 'error');
          return;
        }

        const question = data.question;
        if (!question || !Number.isInteger(question.id) || question.id !== Number(questionId) ||
            typeof question.title !== 'string' || typeof question.choice !== 'string' ||
            (typeof question.grade !== 'string' && typeof question.grade !== 'number')) {
          showMessage('题目数据格式异常，请稍后重试。', 'error');
          return;
        }
        number.textContent = `题目编号 · ${question.id}`;
        score.textContent = `${question.grade} 分`;
        title.textContent = question.title;
        choices.textContent = question.choice || '这道题暂未提供选项。';
        currentQuestion = question;
        document.title = `第 ${question.id} 题 · JIAO 学习平台`;
        message.hidden = true;
        detail.hidden = false;
        loadProgress();
      } catch (error) {
        showMessage(error.name === 'AbortError'
          ? '加载超时，请点击“重新加载”重试。'
          : '暂时无法连接服务，请检查网络后重试。', 'error');
      } finally {
        clearTimeout(timeout);
        refreshButton.disabled = false;
        refreshButton.textContent = '重新加载';
        answerFields.disabled = currentQuestion === null || JiaoProgress.saving;
        content.setAttribute('aria-busy', 'false');
      }
    }

    answerInput.addEventListener('input', () => { answerResult.hidden = true; });

    answerForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (judging || JiaoProgress.saving || currentQuestion === null || !answerForm.reportValidity()) return;
      const answer = answerInput.value.trim();
      if (!answer) {
        showResult('error', '请先填写答案', '答案不能为空或只有空格。');
        answerInput.focus();
        return;
      }

      judging = true;
      document.getElementById('save-progress').disabled = true;
      answerFields.disabled = true;
      refreshButton.disabled = true;
      submitAnswer.textContent = '正在判题…';
      answerForm.setAttribute('aria-busy', 'true');
      showResult('pending', '正在判题', '答案已提交，请稍候…', answer);

      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 12000);
      try {
        const response = await fetch(`/api/question/${encodeURIComponent(currentQuestion.id)}/judge`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({ answer }),
          signal: controller.signal
        });
        if (JiaoSession.redirectIfUnauthorized(response)) return;

        let data;
        try {
          data = await response.json();
        } catch (error) {
          if (error.name === 'AbortError') throw error;
          showResult('error', '提交失败', '服务响应异常，请稍后重新提交。', answer);
          return;
        }
        if (!data || typeof data !== 'object' || Array.isArray(data)) {
          showResult('error', '提交失败', '判题结果格式异常，请稍后重试。', answer);
          return;
        }
        const text = typeof data.message === 'string' ? data.message : '';
        if (!response.ok || data.success === false) {
          showResult('error', '提交失败', text || '判题失败，请稍后重试。', answer);
          return;
        }
        if (data.success !== true) {
          showResult('error', '提交失败', '判题结果格式异常，请稍后重试。', answer);
          return;
        }

        // success 表示请求处理成功，对错优先使用 correct，兼容当前接口的 message。
        const correct = typeof data.correct === 'boolean' ? data.correct
          : (text === '回答正确' ? true : (text === '回答错误' ? false : null));
        if (correct === true) {
          showResult('correct', '回答正确', text || '这道题答对了，继续保持！', answer);
        } else if (correct === false) {
          showResult('incorrect', '回答错误', text || '再想一想，可以修改答案后重新提交。', answer);
        } else {
          showResult('complete', '判题完成', text || '服务端未返回明确的对错结果。', answer);
        }
        // 判题成功后重新读取服务端状态，不在浏览器猜测或累加次数。
        JiaoProgress.markChanged();
        loadProgress();
      } catch (error) {
        showResult('error', '提交失败', error.name === 'AbortError'
          ? '判题请求超时，请稍后重新提交。'
          : '暂时无法连接服务，请检查网络后重试。', answer);
      } finally {
        clearTimeout(timeout);
        judging = false;
        document.getElementById('save-progress').disabled = JiaoProgress.saving;
        answerFields.disabled = currentQuestion === null;
        refreshButton.disabled = false;
        submitAnswer.textContent = '提交判题';
        answerForm.removeAttribute('aria-busy');
      }
    });

    JiaoSession.init({ required: true });
    JiaoProgress.bindSaveButton({
      onSaved: loadProgress,
      canSave: () => currentQuestion !== null && !judging,
      onBusy: busy => {
        answerFields.disabled = busy || judging || currentQuestion === null;
        refreshButton.disabled = busy || judging;
      }
    });
    document.getElementById('refresh-progress').addEventListener('click', loadProgress);
    refreshButton.addEventListener('click', loadQuestion);
    loadQuestion();
  </script>
</body>
</html>
